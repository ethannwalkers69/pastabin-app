<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Premium Pastebin - Create and share text snippets with a beautiful glassmorphism interface. Fast, secure, and easy to use.">
    <meta name="keywords" content="pastebin, text sharing, code snippets, paste, share text">
    <meta name="author" content="PasteBin Premium">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="Premium Pastebin - Share Text Beautifully">
    <meta property="og:description" content="Create and share text snippets with a stunning glassmorphism interface. Fast, secure, and elegant.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pastebin-app.onrender.com">
    <meta property="og:image" content="https://pastebin-app.onrender.com/og-image.png">
    <meta property="og:site_name" content="Premium Pastebin">
    
    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Premium Pastebin - Share Text Beautifully">
    <meta name="twitter:description" content="Create and share text snippets with a stunning glassmorphism interface.">
    <meta name="twitter:image" content="https://pastebin-app.onrender.com/twitter-image.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
    
    <title>Premium Pastebin - Share Text Beautifully</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-muted: rgba(255, 255, 255, 0.6);
            --success-color: #4ade80;
            --error-color: #f87171;
            --warning-color: #fbbf24;
            --animation-duration: 0.3s;
            --border-radius: 16px;
            --button-radius: 12px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            line-height: 1.6;
        }

        /* Floating Particles Animation */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }

        /* Main Container */
        .main-container {
            width: 100%;
            max-width: 800px;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            box-shadow: var(--glass-shadow);
            padding: 40px;
            transition: all var(--animation-duration) ease;
        }

        .glass-card:hover {
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.5);
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 3.5rem;
            margin-bottom: 16px;
            display: inline-block;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .title {
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 400;
        }

        /* Textarea Container */
        .textarea-container {
            position: relative;
            margin-bottom: 24px;
            animation: slideUp 0.8s ease-out 0.2s both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .textarea-wrapper {
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius);
            transition: all var(--animation-duration) ease;
            overflow: hidden;
        }

        .textarea-wrapper:focus-within {
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
            transform: translateY(-2px);
        }

        textarea {
            width: 100%;
            min-height: 250px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
            font-size: 1rem;
            line-height: 1.6;
            padding: 20px;
            resize: vertical;
            outline: none;
            transition: all var(--animation-duration) ease;
        }

        textarea::placeholder {
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
        }

        /* Character Counter */
        .char-counter {
            position: absolute;
            bottom: 12px;
            right: 16px;
            color: var(--text-muted);
            font-size: 0.85rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            transition: all var(--animation-duration) ease;
        }

        .char-counter.warning {
            color: var(--warning-color);
            animation: shake 0.5s ease;
        }

        .char-counter.limit {
            color: var(--error-color);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Button Container */
        .button-container {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            animation: slideUp 0.8s ease-out 0.4s both;
        }

        /* Buttons */
        .btn {
            flex: 1;
            min-width: 140px;
            padding: 14px 28px;
            border: none;
            border-radius: var(--button-radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--animation-duration) ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-success {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(74, 222, 128, 0.4);
        }

        .btn-success:hover {
            box-shadow: 0 6px 20px rgba(74, 222, 128, 0.6);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f87171 0%, #ef4444 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(248, 113, 113, 0.4);
        }

        .btn-danger:hover {
            box-shadow: 0 6px 20px rgba(248, 113, 113, 0.6);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn .icon {
            font-size: 1.2rem;
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toast {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px 24px;
            color: white;
            font-weight: 500;
            box-shadow: var(--glass-shadow);
            animation: slideInRight 0.3s ease-out;
            min-width: 300px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        .toast.success {
            border-left: 4px solid var(--success-color);
        }

        .toast.error {
            border-left: 4px solid var(--error-color);
        }

        .toast.info {
            border-left: 4px solid #60a5fa;
        }

        .toast-icon {
            font-size: 1.5rem;
        }

        /* Keyboard Shortcuts Info */
        .shortcuts-info {
            margin-top: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            animation: fadeIn 1s ease-out 0.6s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .shortcuts-info kbd {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 24px;
            color: var(--text-muted);
            font-size: 0.85rem;
            animation: fadeIn 1s ease-out 0.8s both;
        }

        /* Glow Effects */
        .glow-effect {
            position: relative;
        }

        .glow-effect::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: var(--primary-gradient);
            border-radius: inherit;
            z-index: -1;
            opacity: 0;
            transition: opacity var(--animation-duration) ease;
        }

        .glow-effect:hover::after {
            opacity: 0.3;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .glass-card {
                padding: 24px;
            }

            .title {
                font-size: 2rem;
            }

            .button-container {
                flex-direction: column;
            }

            .btn {
                min-width: 100%;
            }

            textarea {
                min-height: 200px;
                font-size: 0.9rem;
            }

            .toast {
                min-width: 250px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .glass-card {
                padding: 16px;
            }

            .title {
                font-size: 1.5rem;
            }

            .logo {
                font-size: 2.5rem;
            }

            textarea {
                min-height: 150px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <!-- Floating Particles -->
    <div class="particles-container" id="particles"></div>

    <!-- Toast Notifications Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Main Application -->
    <div class="main-container">
        <div class="glass-card">
            <!-- Header -->
            <div class="header">
                <div class="logo">📝</div>
                <h1 class="title">Premium Pastebin</h1>
                <p class="subtitle">Create & Share Beautiful Text Snippets</p>
            </div>

            <!-- Textarea Section -->
            <div class="textarea-container">
                <div class="textarea-wrapper glow-effect">
                    <textarea 
                        id="textInput" 
                        placeholder="Paste or type your text here... ✨"
                        maxlength="50000"
                        aria-label="Text input area"
                    ></textarea>
                    <div class="char-counter" id="charCounter">0 / 50,000</div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="button-container">
                <button class="btn btn-primary" id="createPasteBtn" title="Create Paste (Ctrl+Enter)">
                    <span class="icon">🚀</span>
                    <span>Create Paste</span>
                </button>
                <button class="btn btn-success" id="copyBtn" title="Copy to Clipboard (Ctrl+C)">
                    <span class="icon">📋</span>
                    <span>Copy</span>
                </button>
                <button class="btn btn-secondary" id="openBtn" title="Open Last Paste (Ctrl+O)">
                    <span class="icon">🔗</span>
                    <span>Open</span>
                </button>
                <button class="btn btn-danger" id="clearBtn" title="Clear Text (Ctrl+Shift+X)">
                    <span class="icon">🗑️</span>
                    <span>Clear</span>
                </button>
            </div>
        </div>

        <!-- Keyboard Shortcuts Info -->
        <div class="shortcuts-info">
            <span>⌨️ Shortcuts:</span>
            <kbd>Ctrl+Enter</kbd> Create &nbsp;
            <kbd>Ctrl+C</kbd> Copy &nbsp;
            <kbd>Ctrl+O</kbd> Open &nbsp;
            <kbd>Ctrl+Shift+X</kbd> Clear
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>© 2024 Premium Pastebin • Built with ❤️ • Secure & Fast</p>
        </div>
    </div>

    <script>
        // ============ DOM Elements ============
        const textInput = document.getElementById('textInput');
        const charCounter = document.getElementById('charCounter');
        const createPasteBtn = document.getElementById('createPasteBtn');
        const copyBtn = document.getElementById('copyBtn');
        const openBtn = document.getElementById('openBtn');
        const clearBtn = document.getElementById('clearBtn');
        const toastContainer = document.getElementById('toastContainer');
        const particlesContainer = document.getElementById('particles');

        // ============ State Management ============
        let lastPasteUrl = null;
        let isCreating = false;

        // ============ Initialize Application ============
        function init() {
            createParticles();
            setupEventListeners();
            updateCharCounter();
        }

        // ============ Create Floating Particles ============
        function createParticles() {
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Randomize particle properties
                const size = Math.random() * 8 + 3;
                const startX = Math.random() * 100;
                const duration = Math.random() * 15 + 10;
                const delay = Math.random() * 10;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${startX}%`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;
                
                particlesContainer.appendChild(particle);
            }
        }

        // ============ Event Listeners ============
        function setupEventListeners() {
            // Text input events
            textInput.addEventListener('input', updateCharCounter);
            textInput.addEventListener('keydown', handleKeyboardShortcuts);
            
            // Button click events
            createPasteBtn.addEventListener('click', createPaste);
            copyBtn.addEventListener('click', copyToClipboard);
            openBtn.addEventListener('click', openLastPaste);
            clearBtn.addEventListener('click', clearText);
            
            // Auto-resize textarea
            textInput.addEventListener('input', autoResizeTextarea);
            
            // Global keyboard shortcuts
            document.addEventListener('keydown', handleGlobalShortcuts);
        }

        // ============ Update Character Counter ============
        function updateCharCounter() {
            const charCount = textInput.value.length;
            const maxLength = 50000;
            
            charCounter.textContent = `${charCount.toLocaleString()} / ${maxLength.toLocaleString()}`;
            
            // Remove existing state classes
            charCounter.classList.remove('warning', 'limit');
            
            // Add appropriate class based on character count
            if (charCount > maxLength * 0.9) {
                charCounter.classList.add('limit');
            } else if (charCount > maxLength * 0.75) {
                charCounter.classList.add('warning');
            }
        }

        // ============ Auto-resize Textarea ============
        function autoResizeTextarea() {
            textInput.style.height = 'auto';
            textInput.style.height = textInput.scrollHeight + 'px';
            
            // Reset to minimum height if empty
            if (textInput.value === '') {
                textInput.style.height = '250px';
            }
        }

        // ============ Create Paste ============
        async function createPaste() {
            const text = textInput.value.trim();
            
            // Validation
            if (!text) {
                showToast('Please enter some text to create a paste.', 'info', 'ℹ️');
                textInput.focus();
                return;
            }
            
            if (text.length > 50000) {
                showToast('Text exceeds maximum length of 50,000 characters.', 'error', '❌');
                return;
            }
            
            // Prevent double submission
            if (isCreating) return;
            
            // Set loading state
            isCreating = true;
            setLoadingState(true);
            
            try {
                // Make API request
                const response = await fetch('/api/create-paste', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.success) {
                    // Extract URL from response
                    const pasteUrl = data.data?.url || data.data?.pasteUrl || data.data?.link;
                    
                    if (pasteUrl) {
                        lastPasteUrl = pasteUrl;
                        showToast('Paste created successfully! 🎉', 'success', '✅');
                        
                        // Add success animation to textarea
                        animateSuccess();
                    } else {
                        showToast('Paste created, but URL not found in response.', 'info', 'ℹ️');
                    }
                } else {
                    throw new Error(data.error || 'Failed to create paste');
                }
                
            } catch (error) {
                console.error('Error creating paste:', error);
                showToast(`Error: ${error.message}`, 'error', '❌');
            } finally {
                isCreating = false;
                setLoadingState(false);
            }
        }

        // ============ Set Loading State ============
        function setLoadingState(isLoading) {
            if (isLoading) {
                createPasteBtn.disabled = true;
                createPasteBtn.innerHTML = '<span class="spinner"></span><span>Creating...</span>';
            } else {
                createPasteBtn.disabled = false;
                createPasteBtn.innerHTML = '<span class="icon">🚀</span><span>Create Paste</span>';
            }
        }

        // ============ Success Animation ============
        function animateSuccess() {
            const wrapper = document.querySelector('.textarea-wrapper');
            wrapper.style.borderColor = 'rgba(74, 222, 128, 0.5)';
            wrapper.style.boxShadow = '0 0 30px rgba(74, 222, 128, 0.3)';
            
            setTimeout(() => {
                wrapper.style.borderColor = 'rgba(255, 255, 255, 0.1)';
                wrapper.style.boxShadow = 'none';
            }, 2000);
        }

        // ============ Copy to Clipboard ============
        async function copyToClipboard() {
            const text = textInput.value;
            
            if (!text) {
                showToast('Nothing to copy! Please enter some text first.', 'info', 'ℹ️');
                return;
            }
            
            try {
                // Try modern clipboard API first
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    // Fallback for older browsers
                    const textArea = document.createElement('textarea');
                    textArea.value = text;
                    textArea.style.position = 'fixed';
                    textArea.style.left = '-999999px';
                    textArea.style.top = '-999999px';
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    
                    try {
                        document.execCommand('copy');
                    } catch (err) {
                        console.error('Fallback copy failed:', err);
                        throw new Error('Copy failed');
                    } finally {
                        document.body.removeChild(textArea);
                    }
                }
                
                showToast('Text copied to clipboard! 📋', 'success', '✅');
                
                // Visual feedback on button
                const originalHTML = copyBtn.innerHTML;
                copyBtn.innerHTML = '<span class="icon">✓</span><span>Copied!</span>';
                setTimeout(() => {
                    copyBtn.innerHTML = originalHTML;
                }, 2000);
                
            } catch (error) {
                console.error('Copy failed:', error);
                showToast('Failed to copy text. Please try again.', 'error', '❌');
            }
        }

        // ============ Open Last Paste ============
        function openLastPaste() {
            if (lastPasteUrl) {
                window.open(lastPasteUrl, '_blank', 'noopener,noreferrer');
                showToast('Opening paste in new tab... 🔗', 'success', '✅');
            } else {
                showToast('No paste created yet. Create one first!', 'info', 'ℹ️');
            }
        }

        // ============ Clear Text ============
        function clearText() {
            if (textInput.value.length === 0) {
                showToast('Text area is already empty.', 'info', 'ℹ️');
                return;
            }
            
            // Add fade-out animation
            textInput.style.opacity = '0';
            textInput.style.transform = 'scale(0.98)';
            
            setTimeout(() => {
                textInput.value = '';
                updateCharCounter();
                autoResizeTextarea();
                
                // Reset animation
                textInput.style.opacity = '1';
                textInput.style.transform = 'scale(1)';
                
                showToast('Text cleared! 🗑️', 'success', '✅');
            }, 200);
        }

        // ============ Keyboard Shortcuts ============
        function handleKeyboardShortcuts(e) {
            // Ctrl/Cmd + Enter to create paste
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                createPaste();
            }
        }

        function handleGlobalShortcuts(e) {
            // Don't trigger shortcuts when typing in textarea
            if (e.target === textInput) return;
            
            // Ctrl/Cmd + O to open last paste
            if ((e.ctrlKey || e.metaKey) && e.key === 'o') {
                e.preventDefault();
                openLastPaste();
            }
            
            // Ctrl/Cmd + Shift + X to clear
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'X') {
                e.preventDefault();
                clearText();
            }
        }

        // ============ Toast Notification System ============
        function showToast(message, type = 'info', icon = 'ℹ️') {
            const toast = document.createElement('div');
            toast.classList.add('toast', type);
            
            toast.innerHTML = `
                <span class="toast-icon">${icon}</span>
                <span class="toast-message">${message}</span>
            `;
            
            toastContainer.appendChild(toast);
            
            // Auto-remove after 4 seconds
            setTimeout(() => {
                toast.style.animation = 'slideOutRight 0.3s ease-out forwards';
                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.parentNode.removeChild(toast);
                    }
                }, 300);
            }, 4000);
        }

        // ============ Handle Window Resize ============
        window.addEventListener('resize', () => {
            if (textInput.value === '') {
                const windowWidth = window.innerWidth;
                if (windowWidth <= 480) {
                    textInput.style.height = '150px';
                } else if (windowWidth <= 768) {
                    textInput.style.height = '200px';
                } else {
                    textInput.style.height = '250px';
                }
            }
        });

        // ============ Service Worker Registration for PWA (Optional) ============
        if ('serviceWorker' in navigator) {
            // Uncomment to enable PWA functionality
            // navigator.serviceWorker.register('/sw.js')
            //     .then(registration => console.log('ServiceWorker registered'))
            //     .catch(err => console.log('ServiceWorker registration failed: ', err));
        }

        // ============ Initialize App ============
        init();

        // ============ Console Welcome Message ============
        console.log(`
        🚀 Premium Pastebin Ready!
        📝 Start typing to create beautiful pastes
        ⌨️  Use keyboard shortcuts for faster workflow
        🌟 Enjoy the glassmorphism experience!
        `);
    </script>
</body>
</html>
